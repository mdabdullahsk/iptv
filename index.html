<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Live TV - Abdullah017</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Poppins', sans-serif; user-select: none; }
        
        .header { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); padding: 15px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #334155; }
        .search-box { width: 90%; max-width: 400px; padding: 10px; border-radius: 20px; border: none; outline: none; background: #334155; color: #fff; margin-top: 10px; }

        .container { width: 95%; max-width: 1000px; margin: 20px auto; }
        
        /* Player Section */
        .player-area { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 15px; overflow: hidden; border: 2px solid #334155; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .player-area iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; margin-top: 30px; }
        .card { background: var(--card); padding: 10px; border-radius: 12px; cursor: pointer; transition: 0.3s; border: 2px solid transparent; text-align: center; }
        .card:hover, .active-card { border-color: var(--primary); transform: translateY(-5px); background: #2d3748; }
        .card img { width: 100%; height: 75px; object-fit: contain; background: #fff; border-radius: 8px; margin-bottom: 8px; }
        .card p { margin: 0; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        #fix-msg { font-size: 12px; color: #facc15; margin-top: 10px; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="header">
        <h2 style="margin:0; color:var(--primary);">Premium TV</h2>
        <input type="text" id="search" class="search-box" placeholder="Search Channel...">
    </div>

    <div class="container">
        <div class="player-area">
            <iframe id="main-player" src="" allowfullscreen></iframe>
        </div>
        <p id="fix-msg" onclick="alert('নির্দেশনা:\n১. লকের (Lock) আইকনে ক্লিক করে Site Settings-এ যান।\n২. Insecure Content -> Allow করুন।\n৩. পেজটি রিফ্রেশ দিন।')">⚠️ ভিডিও না চললে এখানে ক্লিক করুন</p>
        
        <div class="grid" id="channel-list"></div>
    </div>

    <script>
        const API_URL = "https://raw.githubusercontent.com/mdabdullahsk/channels-list/main/channels.json";
        const PLAYER_BRIDGE = "https://Abdullah017.pythonanywhere.com/play?id=";

        async function loadTV() {
            const listDiv = document.getElementById('channel-list');
            const searchInput = document.getElementById('search');
            let channels = [];

            try {
                const res = await fetch(API_URL);
                channels = await res.json();

                const display = (data) => {
                    listDiv.innerHTML = "";
                    data.forEach((ch, i) => {
                        const card = document.createElement('div');
                        card.className = "card";
                        card.innerHTML = `<img src="https://images.weserv.nl/?url=${encodeURIComponent(ch.img)}&w=200"><p>${ch.name}</p>`;
                        card.onclick = () => {
                            document.querySelectorAll('.card').forEach(c => c.classList.remove('active-card'));
                            card.classList.add('active-card');
                            document.getElementById('main-player').src = PLAYER_BRIDGE + ch.id;
                            window.scrollTo({top: 0, behavior: 'smooth'});
                        };
                        listDiv.appendChild(card);
                        if(i === 0 && searchInput.value === "") card.click();
                    });
                };

                display(channels);

                // সার্চ ফাংশন
                searchInput.oninput = () => {
                    const filtered = channels.filter(c => c.name.toLowerCase().includes(searchInput.value.toLowerCase()));
                    display(filtered);
                };

            } catch (e) { console.log("Error loading channels"); }
        }

        loadTV();
        
        // কিবোর্ড সিকিউরিটি
        document.onkeydown = (e) => { if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73)) return false; };
    </script>
</body>
</html>
