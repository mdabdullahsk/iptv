<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Live TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; background: #0f172a; color: white; font-family: 'Poppins', sans-serif; 
            text-align: center; 
            user-select: none; /* টেক্সট কপি বন্ধ */
        }
        .container { width: 95%; max-width: 900px; margin: 20px auto; }
        
        /* Iframe Player Design */
        .player-wrapper { 
            position: relative; width: 100%; padding-bottom: 56.25%; /* 16:9 */
            background: #000; border-radius: 12px; overflow: hidden; 
            border: 2px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .player-wrapper iframe { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; 
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; margin-top: 25px; }
        .card { background: #1e293b; padding: 12px; border-radius: 10px; cursor: pointer; transition: 0.3s; border: 2px solid transparent; }
        .card:hover, .active-card { border-color: #38bdf8; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(56, 189, 248, 0.2); }
        .card img { width: 100%; height: 75px; object-fit: contain; background: #fff; border-radius: 6px; margin-bottom: 8px; padding: 2px; }
        .card p { margin: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        h2 { color: #38bdf8; margin: 15px 0; font-size: 20px; }
        #loading-msg { color: #10b981; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body oncontextmenu="return false;"> <!-- রাইট ক্লিক পুরোপুরি বন্ধ -->

    <h2>Live: <span id="ch-name">Loading...</span></h2>
    <div id="loading-msg">Fetching Channels...</div>
    
    <div class="container">
        <!-- Secure Iframe Player -->
        <div class="player-wrapper">
            <iframe id="main-player" src="about:blank" allowfullscreen></iframe>
        </div>
        
        <!-- Channel Grid -->
        <div class="grid" id="list"></div>
    </div>

    <script>
        // ১. কীবোর্ড শর্টকাট বন্ধ করা (F12, Ctrl+Shift+I, Ctrl+U) যাতে কেউ কোড দেখতে না পারে
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; 
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; 
        };

        // ২. সোর্স লিঙ্ক এনক্রিপ্ট করা (Base64) - কোডে আসল আইপি দেখা যাবে না
        const secretUrl = "aHR0cDovLzEwMy4xNDQuODkuMjUxL3BsYXllci5waHA/c3RyZWFtPQ==";
        const JSON_URL = "https://raw.githubusercontent.com/mdabdullahsk/channels-list/main/channels.json";

        document.addEventListener("DOMContentLoaded", async () => {
            const listContainer = document.getElementById('list');
            const nameText = document.getElementById('ch-name');
            const loadingMsg = document.getElementById('loading-msg');
            const playerIframe = document.getElementById('main-player');

            try {
                const res = await fetch(JSON_URL);
                if (!res.ok) throw new Error("Failed");
                const channels = await res.json();
                
                loadingMsg.style.display = 'none';

                channels.forEach((ch, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // ইমেজ প্রক্সি (লোগো ফিক্স)
                    const safeImg = `https://images.weserv.nl/?url=${encodeURIComponent(ch.img)}`;
                    
                    card.innerHTML = `<img src="${safeImg}" onerror="this.src='https://via.placeholder.com/150?text=TV'"><p>${ch.name}</p>`;
                    
                    card.onclick = () => {
                        document.querySelectorAll('.card').forEach(c => c.classList.remove('active-card'));
                        card.classList.add('active-card');
                        nameText.innerText = ch.name;
                        
                        // ডিকোড করে আইফ্রেমে ভিডিও প্লে করা
                        playerIframe.src = atob(secretUrl) + ch.id;
                        
                        // মোবাইলে প্লেয়ারে ফোকাস করা
                        if(window.innerWidth < 800) window.scrollTo({top: 0, behavior: 'smooth'});
                    };

                    listContainer.appendChild(card);
                    
                    // অটো প্লে প্রথম চ্যানেল
                    if (index === 0) card.click(); 
                });
            } catch (e) {
                nameText.innerText = "Error!";
                loadingMsg.innerText = "Please check your internet connection.";
                loadingMsg.style.color = "#ef4444";
            }
        });
    </script>
</body>
</html>
