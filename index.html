<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Live TV - Direct Secure Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #0b0f19; color: white; font-family: 'Poppins', sans-serif; text-align: center; user-select: none; }
        .container { width: 95%; max-width: 900px; margin: 20px auto; }
        
        /* Player Design */
        .player-wrapper { 
            position: relative; width: 100%; padding-bottom: 56.25%; 
            background: #000; border-radius: 15px; overflow: hidden; 
            border: 2px solid #2d3748; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        .player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* Grid Design */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; margin-top: 25px; }
        .card { 
            background: #1a202c; padding: 12px; border-radius: 12px; cursor: pointer; 
            transition: 0.3s; border: 2px solid transparent;
        }
        .card:hover, .active-card { border-color: #38bdf8; transform: translateY(-5px); background: #2d3748; }
        .card img { width: 100%; height: 80px; object-fit: contain; background: #fff; border-radius: 8px; margin-bottom: 8px; }
        .card p { margin: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        h2 { color: #38bdf8; font-size: 22px; margin-bottom: 10px; }
        #loading { color: #4ade80; font-size: 14px; margin-bottom: 10px; }
        
        /* Alert Message */
        .alert { background: #facc15; color: #000; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="container">
        <!-- Mixed Content Warning -->
        <div id="mixed-warning" class="alert">
            ভিডিও না চললে ব্রাউজারের উপরে (lock icon) থেকে <b>Insecure Content</b> Allow করুন অথবা <b>HTTP</b> দিয়ে সাইটটি ওপেন করুন।
        </div>

        <h2>Live: <span id="ch-name">Loading...</span></h2>
        <div id="loading">Connecting to Secure Server...</div>
        
        <div class="player-wrapper">
            <iframe id="main-player" src="about:blank" allowfullscreen></iframe>
        </div>
        
        <div class="grid" id="list"></div>
    </div>

    <script>
        // ১. কিবোর্ড সিকিউরিটি
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) return false;
        };

        // ২. এনক্রিপ্টেড লিঙ্ক (Base64) - যাতে সরাসরি IP না দেখা যায়
        // এই স্ট্রিংটি আসলে "http://103.144.89.251/player.php?stream="
        const _0x4a2e = "aHR0cDovLzEwMy4xNDQuODkuMjUxL3BsYXllci5waHA/c3RyZWFtPQ==";
        const JSON_URL = "https://raw.githubusercontent.com/mdabdullahsk/channels-list/main/channels.json";

        // ৩. মিক্সড কন্টেন্ট চেক (HTTPS এ থাকলে সতর্ক করবে)
        if (location.protocol === 'https:') {
            document.getElementById('mixed-warning').style.display = 'block';
        }

        async function fetchChannels() {
            const listContainer = document.getElementById('list');
            const nameText = document.getElementById('ch-name');
            const loadingMsg = document.getElementById('loading');
            const playerIframe = document.getElementById('main-player');

            try {
                const response = await fetch(JSON_URL);
                const channels = await response.json();
                loadingMsg.style.display = 'none';

                channels.forEach((ch, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // ইমেজ প্রক্সি (যাতে লোগো লোড হয়)
                    const logo = `https://images.weserv.nl/?url=${encodeURIComponent(ch.img)}&w=150&h=80`;
                    
                    card.innerHTML = `<img src="${logo}" onerror="this.src='https://via.placeholder.com/150?text=No+Logo'"><p>${ch.name}</p>`;
                    
                    card.onclick = () => {
                        document.querySelectorAll('.card').forEach(c => c.classList.remove('active-card'));
                        card.classList.add('active-card');
                        nameText.innerText = ch.name;
                        
                        // লিঙ্ক ডিকোড করে সরাসরি প্লেয়ারে বসানো
                        const target = atob(_0x4a2e) + ch.id;
                        playerIframe.src = target;

                        if(window.innerWidth < 800) window.scrollTo({top: 0, behavior: 'smooth'});
                    };

                    listContainer.appendChild(card);
                    if (index === 0) card.click(); 
                });
            } catch (err) {
                loadingMsg.innerText = "Error: Could not load channels!";
                loadingMsg.style.color = "#ff4444";
            }
        }

        fetchChannels();
    </script>
</body>
</html>
